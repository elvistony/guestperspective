<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wedding Camera</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="overlay">
        <div class="overlay-card p-4">
            <div class="wedding-logo mb-3"><i class="bi bi-heart-fill"></i></div>
            
            <div id="step-1" class="step">
                <h4 class="mb-4">Select Language</h4>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-light rounded-pill" onclick="setLanguage('en')">English</button>
                    <button class="btn btn-outline-light rounded-pill" onclick="setLanguage('ml')">മലയാളം</button>
                    <button class="btn btn-outline-light rounded-pill" onclick="setLanguage('ar')">العربية</button>
                </div>
            </div>

            <div id="step-2" class="step d-none">
                <h4 id="txt-welcome" class="mb-2">Wedding Camera</h4>
                <p id="txt-names" class="names-display mb-4">Sarah & Marc</p>
                <input type="text" id="guest-name-input" class="form-control bg-dark text-white border-secondary rounded-pill text-center mb-4" placeholder="Your Name">
                <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-light w-100 h-100 py-3 rounded-4" onclick="setSource('camera')">
                            <i class="bi bi-camera-fill d-block mb-1"></i>
                            <span id="txt-btn-camera">Camera</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-secondary w-100 h-100 py-3 rounded-4" onclick="setSource('gallery')">
                            <i class="bi bi-images d-block mb-1"></i>
                            <span id="txt-btn-gallery">Gallery</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="step-3" class="step d-none">
                <div id="camera-perm-view" class="d-none">
                    <i class="bi bi-camera text-primary" style="font-size: 3rem;"></i>
                    <h5 class="mt-3" id="txt-perm-title">Camera Permission</h5>
                    <p class="small text-secondary" id="txt-perm-desc">We need access to take photos.</p>
                    <button class="btn btn-primary rounded-pill w-100" onclick="initCameraMode()">Grant & Start</button>
                </div>
                <div id="gallery-upload-view" class="d-none">
                    <i class="bi bi-cloud-upload text-success" style="font-size: 3rem;"></i>
                    <h5 class="mt-3" id="txt-gal-title">Upload from Gallery</h5>
                    <p class="small text-secondary" id="txt-gal-desc">Select up to 25 photos.</p>
                    <input type="file" id="gallery-input" multiple accept="image/*" class="d-none" onchange="handleFileSelect(event)">
                    <button class="btn btn-success rounded-pill w-100 mb-2" onclick="document.getElementById('gallery-input').click()">Choose Photos</button>
                    <button id="batch-upload-btn" class="btn btn-light rounded-pill w-100 d-none" onclick="uploadBatch()">Proceed to Upload</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app-content" style="display: none;">
        <div id="camera-container">
            <video id="video-feed" autoplay playsinline muted></video>
            <div class="top-controls">
                <span id="display-guest-name" class="guest-label"></span>
                <i class="bi bi-chevron-up rotate-icon" onclick="location.reload()"></i>
            </div>
            <div class="zoom-container">
                <div class="zoom-presets">
                    <button class="zoom-pill rotate-icon active" onclick="setZoom(1, this)">1x</button>
                    <button class="zoom-pill rotate-icon" onclick="setZoom(1.5, this)">2x</button>
                </div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="mode-container">
                <div class="mode-text rotate-icon" id="txt-mode-photo">PHOTO</div>
            </div>
            <div class="shutter-row">
                <div class="counter-display rotate-icon" id="preview-thumb" onclick="openGallery()">
                    <div class="count-number" id="count">0</div>
                    <div class="count-label">/25</div>
                </div>
                <div class="shutter-outer">
                    <button class="shutter-btn" id="shutter-trigger"></button>
                    <button class="confirm-btn d-none" id="confirm-photo">
                        <i class="bi bi-check-lg" id="confirm-icon"></i>
                        <div class="spinner-border spinner-border-sm d-none" id="upload-spinner"></div>
                    </button>
                </div>
                <button class="flip-btn" id="secondary-action">
                    <i class="bi bi-arrow-repeat rotate-icon" id="flip-icon"></i>
                    <i class="bi bi-x-lg d-none" id="discard-icon"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="gallery-overlay" class="gallery-hidden">
        <div class="gallery-header">
            <button class="btn text-white" onclick="closeGallery()"><i class="bi bi-x-lg"></i></button>
            <span class="fw-bold small" id="txt-gallery-title">WEDDING ROLL</span>
            <div class="d-flex gap-3">
                <button class="btn text-white p-0" onclick="downloadActive()"><i class="bi bi-download"></i></button>
                <button class="btn text-white p-0" onclick="shareActive()"><i class="bi bi-share"></i></button>
            </div>
        </div>
        <div class="gallery-main-view"><img id="main-gallery-img" src=""></div>
        <div class="filmstrip-container"><div id="filmstrip-track" class="filmstrip-track"></div></div>
    </div>

    <canvas id="capture-canvas" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
